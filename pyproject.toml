[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "thrindex"
version = "0.3.4"  # single source of truth; __init__.py reads this via importlib.metadata
description = "The open compiler for spiking neuromorphic compute."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    { name = "Theodoros Nomikos", email = "hello@thrindex.com" },
]
keywords = [
    "neuromorphic",
    "spiking-neural-networks",
    "snn",
    "compiler",
    "pytorch",
    "edge-ai",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Compilers",
    "Typing :: Typed",
]
dependencies = [
    # Justification (§12): SNN layers are nn.Module subclasses; surrogate gradient
    # training requires torch.autograd. No alternative exists in this stack.
    "torch>=2.0",
]

[project.urls]
Homepage = "https://thrindex.com"
Documentation = "https://docs.thrindex.com"
Repository = "https://github.com/thrindex/thrindex"
Issues = "https://github.com/thrindex/thrindex/issues"

[project.scripts]
# Thin Python wrapper — delegates all computation to thrindex._core (PyO3).
# No logic lives here; it is the presentation layer only.
thrindex = "thrindex._cli:main"
thx = "thrindex._cli:main"

[project.optional-dependencies]
dev = [
    "ruff>=0.8",
    "pyright>=1.1",
    "pytest>=8.0",
]
examples = [
    # torchvision: MNIST validation script (python/examples/mnist_lif.py).
    "torchvision>=0.15",
    # h5py: SHD training script (templates/keyword-spotting/train.py).
    "h5py>=3.0",
]

[tool.maturin]
python-source = "python"
module-name = "thrindex._core"
manifest-path = "crates/thrindex-py/Cargo.toml"
features = ["pyo3/extension-module"]
# Exclude dev-only directories from the published wheel.
exclude = ["python/tests/**", "python/examples/**"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "ANN"]
ignore = [
    "ANN401",  # Dynamically typed expressions (Any) — needed in a few torch interop spots
]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"
pythonPlatform = "All"
include = ["python"]
# torch type stubs are intentionally incomplete; these rules produce false positives
# against every torch API call and are suppressed project-wide rather than with
# per-line `# type: ignore` comments scattered through 50+ call sites.
reportUnknownMemberType = "none"
reportUnknownVariableType = "none"
reportUnknownArgumentType = "none"

[tool.pytest.ini_options]
testpaths = ["python/tests"]
