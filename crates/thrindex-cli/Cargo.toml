[package]
name = "thrindex-cli"
version = "0.2.0"
edition = "2024"
description = "thrindex CLI — `thrindex run`, `thrindex doctor`, `thrindex targets`"
license = "Apache-2.0"

[[bin]]
name = "thrindex-cli"
path = "src/main.rs"

[dependencies]
# Justification (§12): argument parsing for the CLI binary.
clap = { version = "4", features = ["derive"] }
# Justification (§12): all simulation logic; CLI is a thin presentation layer.
thrindex-sim = { path = "../thrindex-sim", version = "0.2.0" }
# Justification (§12): fixture JSON loading in `thrindex bench`.
serde_json = "1"
# Justification (§12): conformance harness for `thrindex bench --conformance`.
# `conformance` is a special workspace member (the compatibility suite, §16);
# the CLI is its user-facing entry point. Not a violation of the layer law —
# `conformance` is explicitly outside the L0-L3 hierarchy in ARCHITECTURE.md.
conformance = { path = "../../conformance", version = "0.4.0" }

[dev-dependencies]
# Justification: snapshot testing of §29 CLI transcript format.
insta = "1"
