[package]
name = "thrindex-artifact"
version = "0.1.0"
edition = "2024"
description = "Parser and validator for .thx deployment artifacts (ADR-0006, m2-draft format)"
license = "Apache-2.0"

[dependencies]
# Justification (§12): JSON serialization/deserialization of .thx format (ADR-0006).
serde = { version = "1", features = ["derive"] }
# arbitrary_precision: preserves the exact decimal string of every number so
# that re-serialisation is byte-identical even for fixtures written with
# pre-ryu serde_json versions ("0.9048374180359595" stays intact).
# preserve_order: stores object keys in insertion order (IndexMap) so that
# hand-written fixtures with non-BTreeMap key ordering survive the round-trip
# byte-identically (e.g. "type" before "in_features").
serde_json = { version = "1", features = ["arbitrary_precision", "preserve_order"] }
# Justification (§12): typed errors with minimal boilerplate.
thiserror = "2"
# Justification (§12): CRC32 integrity verification matching thrindex-sim/thrindex-compiler.
crc32fast = "1"
# Justification (§12): SHA-256 content hash for Platform artifact registry.
sha2 = "0.10"
# Justification (§12): base64 decode for weight tensor validation.
base64 = "0.22"

[dev-dependencies]
# Justification: floating-point tolerance in layer-field assertions.
approx = "0.5"
