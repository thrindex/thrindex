[package]
name = "thrindex-py"
version = "0.3.4"
edition = "2024"
description = "Thin PyO3 extension module — zero SNN logic; all computation in core crates"
license = "Apache-2.0"

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
# PyO3 + maturin wiring: exposes the compiled extension as `thrindex._core`.
# Justification (§12): required for PyO3/maturin Python–Rust bridge (M1 DoD).
pyo3 = { version = "0.29", features = ["extension-module"] }
# Behavioral simulator: all execution logic lives here, not in this bridge crate.
thrindex-sim = { path = "../thrindex-sim", version = "0.2.0" }
# Compiler pipeline (capture → validate → lower): Graph IR JSON → .thx artifact JSON.
# Justification (§12): M3 thx.compile routes through this to enforce two-level rule.
thrindex-compiler = { path = "../thrindex-compiler", version = "0.3.0" }
